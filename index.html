<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Industry Atlas v3.2</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#e9eef8;background:#101826}*{box-sizing:border-box}body{max-width:1320px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:27px}small,.muted{color:#9baac1}main{margin-top:22px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card,.panel{background:#192639;border:1px solid #304056;border-radius:14px;padding:18px}.big{font-size:26px;font-weight:700;margin-top:10px}select,input{padding:11px;background:#101826;color:#fff;border:1px solid #52637b;border-radius:8px;width:100%}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:15px 0}table{width:100%;border-collapse:collapse}td,th{padding:11px;text-align:left;border-bottom:1px solid #2b394b}th{color:#9baac1;font-weight:500}td.num{text-align:right;font-variant-numeric:tabular-nums}tr[data-ticker]{cursor:pointer}tr[data-ticker]:hover{background:#293951}.panel{margin-top:14px;overflow-x:auto}button{background:#315fba;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.warning{color:#f5c781}.seven{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.seven>div{background:#101826;padding:13px;border-radius:9px}@media(max-width:700px){.cards,.filters,.seven{grid-template-columns:1fr}body{padding:14px}}
</style></head><body><header><div><h1>Industry Atlas <span style="color:#76a6ff">v3.2</span></h1><small>KRX 일별 데이터 기반 산업·기업 탐색</small></div><small id="stamp">데이터 확인 중</small></header><main><div class="cards"><div class="card"><small>상장 종목</small><div class="big" id="count">—</div></div><div class="card"><small>전체 시가총액</small><div class="big" id="cap">—</div></div><div class="card"><small>KRICS 매핑률</small><div class="big" id="mapped">—</div></div></div><div class="filters"><input id="search" placeholder="기업명 또는 종목코드 검색"><select id="sector"><option value="">전체 산업</option></select><select id="industry"><option value="">전체 산업그룹</option></select><input id="mincap" type="number" min="0" placeholder="최소 시총(억원)"><input id="maxcap" type="number" min="0" placeholder="최대 시총(억원)"><select id="sort"><option value="desc">시총 내림차순</option><option value="asc">시총 오름차순</option><option value="name">기업명순</option></select><select id="market"><option value="">전체 시장</option><option>KOSPI</option><option>KOSDAQ</option></select></div><div class="panel"><h3>산업별 현황</h3><div id="sectors"></div></div><div class="panel"><h3>기업 목록 <small id="result"></small></h3><table><thead><tr><th>기업</th><th>시장</th><th>섹터 / 산업그룹</th><th style="text-align:right">종가(원)</th><th style="text-align:right">시총(억원)</th></tr></thead><tbody id="companies"></tbody></table><button id="more">100개 더 보기</button></div><div class="panel" id="detail" hidden></div><p class="muted">자료: 한국거래소 KRX Open API. 산업분류는 검증된 KRICS 매핑 파일이 제공된 종목에만 표시합니다. 투자 권유가 아닙니다.</p></main><script>
let all=[],shown=100;const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('ko-KR'),cap=n=>fmt(Math.round(n/1e8));function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filtered(){let q=$('search').value.trim().toLowerCase(),s=$('sector').value,m=$('market').value;return all.filter(x=>(!q||x.name.toLowerCase().includes(q)||x.ticker.includes(q))&&(!s||(x.sector||'미분류')===s)&&(!m||x.market===m)&&(!$('industry').value||(x.industry||'미분류')===$('industry').value)&&(!$('mincap').value||x.market_cap>=Number($('mincap').value)*1e8)&&(!$('maxcap').value||x.market_cap<=Number($('maxcap').value)*1e8)).sort((a,b)=>$('sort').value==='name'?a.name.localeCompare(b.name,'ko'):$('sort').value==='asc'?a.market_cap-b.market_cap:b.market_cap-a.market_cap)}function render(){let rows=filtered();$('result').textContent=`${fmt(rows.length)}개`; $('companies').innerHTML=rows.slice(0,shown).map(x=>`<tr data-ticker="${safe(x.ticker)}"><td>${safe(x.name)} <small>${safe(x.ticker)}</small></td><td>${x.market}</td><td>${safe(x.sector||'미분류')} / ${safe(x.industry||'미분류')}</td><td class="num">${fmt(x.close)}</td><td class="num">${cap(x.market_cap)}</td></tr>`).join('');$('more').hidden=shown>=rows.length;let by={};for(let x of rows){let k=$('sector').value?(x.industry||'미분류'):(x.sector||'미분류');(by[k]??={n:0,cap:0}).n++;by[k].cap+=x.market_cap}$('sectors').innerHTML='<table><thead><tr><th>산업</th><th>기업 수</th><th style="text-align:right">시총(억원)</th></tr></thead><tbody>'+Object.entries(by).sort((a,b)=>b[1].cap-a[1].cap).map(([k,v])=>`<tr><td>${safe(k)}</td><td>${fmt(v.n)}</td><td class="num">${cap(v.cap)}</td></tr>`).join('')+'</tbody></table>'}function groups(){let s=$('sector').value;let g=[...new Set(all.filter(x=>!s||(x.sector||'미분류')===s).map(x=>x.industry||'미분류'))].sort();$('industry').innerHTML='<option value="">전체 산업그룹</option>'+g.map(v=>`<option value="${safe(v)}">${safe(v)}</option>`).join('')} $('sector').addEventListener('input',groups);for(let id of ['search','sector','market','industry','mincap','maxcap','sort'])$(id).addEventListener('input',()=>{shown=100;render()});$('more').onclick=()=>{shown+=100;render()};$('companies').onclick=e=>{let tr=e.target.closest('tr[data-ticker]');if(!tr)return;let x=all.find(v=>v.ticker===tr.dataset.ticker);$('detail').hidden=false;$('detail').innerHTML=`<h2>${safe(x.name)} <small>${safe(x.ticker)}</small></h2><p>산업: ${safe(x.sector||'미분류')} / ${safe(x.industry||'미분류')} · 종가 ${fmt(x.close)}원 · 시총 ${cap(x.market_cap)}억원</p><h3>기업 7대 분석 프레임워크</h3><div class="seven">${['① 사업모델','② 산업 내 위치','③ 경쟁력','④ 수익구조','⑤ 성장동력','⑥ 재무건전성','⑦ 기업가치'].map(t=>`<div><b>${t}</b><p class="muted">향후 공시·재무 데이터 연동 예정</p></div>`).join('')}</div>`;$('detail').scrollIntoView({behavior:'smooth'})};fetch('./data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('no data');return r.json()}).then(d=>{all=d.companies||[];$('stamp').textContent=`기준 거래일 ${d.date} · 수집 ${d.updated_at}`;$('count').textContent=fmt(all.length);$('cap').textContent=cap(all.reduce((s,x)=>s+x.market_cap,0))+'억원';$('mapped').textContent=(all.length?100*all.filter(x=>x.sector).length/all.length:0).toFixed(1)+'%';let sectors=[...new Set(all.map(x=>x.sector||'미분류'))].sort();$('sector').innerHTML+=[...sectors].map(s=>`<option value="${safe(s)}">${safe(s)}</option>`).join('');groups();render()}).catch(()=>{$('stamp').innerHTML='<span class="warning">공개 데이터 연결 대기 중입니다. 데이터 이용조건 확인 후 연결합니다.</span>';});
</script></body></html>
